<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹소설 체크리스트</title>
<style>
  body {
    background-color: white;
    color: black;
    font-family: 'Noto Sans KR', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  h1 {
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 2.5rem;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  button {
    background: none;
    border: 1px solid black;
    padding: 12px 30px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.3s;
    font-style: italic;
  }
  button:hover {
    background-color: black;
    color: white;
  }
  #passwordSection, #listSection {
    display: none;
    text-align: center;
  }
  input {
    border: 1px solid #000;
    padding: 10px;
    width: 180px;
    text-align: center;
    margin-bottom: 10px;
  }
  .novelList button {
    display: block;
    margin: 10px auto;
    width: 250px;
  }
</style>
</head>
<body>

<h1>📚 웹소설 체크리스트</h1>
<button id="startBtn">시작하기</button>

<div id="passwordSection">
  <p>암호를 입력하세요</p>
  <input type="password" id="passwordInput" placeholder="암호 입력">
  <button id="confirmBtn">확인</button>
</div>

<div id="listSection" class="novelList">
  <h2>소설 선택</h2>
  <button onclick="alert('전지적 독자 시점 페이지로 이동!')">전지적 독자 시점</button>
  <button onclick="alert('데뷔 못하면 죽는 병 걸림 페이지로 이동!')">데뷔 못하면 죽는 병 걸림</button>
  <button onclick="alert('괴담에 떨어져도 출근을 해야 하는구나 페이지로 이동!')">괴담에 떨어져도 출근을 해야 하는구나</button>
</div>

<script>
const startBtn = document.getElementById('startBtn');
const passwordSection = document.getElementById('passwordSection');
const listSection = document.getElementById('listSection');
const confirmBtn = document.getElementById('confirmBtn');
const passwordInput = document.getElementById('passwordInput');

startBtn.onclick = () => {
  startBtn.style.display = 'none';
  passwordSection.style.display = 'block';
};

confirmBtn.onclick = () => {
  const password = passwordInput.value;
  if (password === "1234") { // 암호 설정 가능
    passwordSection.style.display = 'none';
    listSection.style.display = 'block';
  } else {
    alert('암호가 틀렸습니다.');
  }
};
</script>

</body>
</html>
